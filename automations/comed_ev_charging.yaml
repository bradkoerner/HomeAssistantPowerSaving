# EV Smart Charging - ComEd Price Logic
#
# The last tier deliberately has no SOC condition. Branches are ordered, so with
# a working SOC reading the three tiers above it already caught everything below
# 70%, and it behaves as the "above 70%" tier. With no reading at all - sensor
# unavailable, kia_uvo poll broken (see comed_ev_soc_refresh.yaml) - the SOC
# tiers can't match (numeric_state is false for a non-numeric state) and it
# becomes the blind tier: cheap enough, charge, don't ask how full the car is.
#
# 50% of baseline is the price we'd pay for a nearly-full battery, so blind mode
# is the conservative read. It also has no "charge at any price" floor like the
# < 30% tier, so a long expensive stretch can leave the car uncharged - that's
# what input_boolean.ev_charge_override is for.

alias: EV Smart Charging - ComEd Price Logic
description: >
  Charges EV based on four priority tiers: 1. SOC below 30% → charge always 2.
  SOC 30-50% → charge below 90% of rolling mean 3. SOC 50-70% → charge below 70%
  of rolling mean 4. below 50% of rolling mean → charge regardless of SOC, which
  covers both a battery above 70% and an unknown battery level
triggers:
  - trigger: state
    entity_id: sensor.2023_ioniq_5_ev_battery_level
  - trigger: state
    entity_id: sensor.comed_current_hour_average_price
  - trigger: time_pattern
    minutes: /15
  - trigger: homeassistant
    event: start
conditions: []
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: input_boolean.ev_charge_override
            state: 'on'
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.car_charger
      - conditions:
          - condition: numeric_state
            entity_id: sensor.2023_ioniq_5_ev_battery_level
            below: 30
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.car_charger
        alias: EV below 30%
      - conditions:
          - condition: numeric_state
            entity_id: sensor.2023_ioniq_5_ev_battery_level
            below: 50
          - condition: template
            value_template: >
              {{ states('sensor.comed_current_hour_average_price') | float <
              states('sensor.comed_price_baseline') | float * 1.0 }}
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.car_charger
        alias: EV 30-50% and electricity < 100% of average
      - conditions:
          - condition: numeric_state
            entity_id: sensor.2023_ioniq_5_ev_battery_level
            below: 70
          - condition: template
            value_template: >
              {{ states('sensor.comed_current_hour_average_price') | float <
              states('sensor.comed_price_baseline') | float * 0.85 }}
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.car_charger
        alias: EV 50-70% and electricity < 85% of mean
      - conditions:
          - condition: template
            value_template: >
              {{ states('sensor.comed_current_hour_average_price') | float <
              states('sensor.comed_price_baseline') | float * 0.70 }}
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.car_charger
        alias: Electricity < 70% of mean (don't care what EV is)
    default:
      - action: switch.turn_off
        target:
          entity_id: switch.car_charger
