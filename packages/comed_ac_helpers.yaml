# ComEd AC Energy Automation — Helpers Package
#
# Install instructions:
# 1. Enable packages in your configuration.yaml if not already done:
#      homeassistant:
#        packages: !include_dir_named packages
# 2. Drop this file into your packages/ directory
# 3. Restart Home Assistant
#
# Alternatively, create each helper manually via Settings → Helpers

input_select:
  ac_price_tier:
    name: AC Price Tier
    options:
      - normal
      - high
      - extreme
    initial: normal
    icon: mdi:currency-usd

  ac_time_window:
    name: AC Time Window
    options:
      - awake
      - night
    initial: awake
    icon: mdi:clock-outline
  
  ac_override_mode:
    name: "AC Override Mode"
    options:
      - none
      - comfort
      - away
      - windows_open
    initial: none
    icon: mdi:snowflake-check

input_boolean:
  ev_charge_override:
    name: EV Charge Override
    initial: false
    icon: mdi:ev-station

  # Manual-hold flags for window-unit bedrooms during windows_open mode.
  # No `initial:` on purpose — these persist across HA restarts so a restart
  # overnight doesn't drop a hold and kill a sleeping kid's AC.
  # Managed by automations/comed_ac_bedroom_hold.yaml.
  bedroom_2_manual_hold:
    name: Bedroom 2 AC Manual Hold
    icon: mdi:snowflake-alert
  bedroom_3_manual_hold:
    name: Bedroom 3 AC Manual Hold
    icon: mdi:snowflake-alert
  primary_bedroom_manual_hold:
    name: Primary Bedroom AC Manual Hold
    icon: mdi:snowflake-alert

sensor:
  - platform: statistics
    name: ComEd Price Mean 3d
    unique_id: comed_price_mean_3d
    entity_id: sensor.comed_current_hour_average_price
    state_characteristic: mean
    max_age: { hours: 72 }
    sampling_size: 1000

  - platform: statistics
    name: ComEd Price Median 24h
    unique_id: comed_price_median_24h
    entity_id: sensor.comed_current_hour_average_price
    state_characteristic: median
    max_age: { hours: 24 }
    sampling_size: 400

template:
  - sensor:
    - name: ComEd Price Baseline
      unique_id: comed_price_baseline
      unit_of_measurement: ¢/kWh
      state_class: measurement
      state: >
        {% set m = states('sensor.comed_price_mean_3d') | float(none) %}
        {% set d = states('sensor.comed_price_median_24h') | float(none) %}
        {{ [[m, d] | reject('none') | min, 1.0] | max | round(3) }}
      availability: >
        {{ states('sensor.comed_price_mean_3d') | float(none) is not none
           or states('sensor.comed_price_median_24h') | float(none) is not none }}

  # Scheduled-occupancy windows for the two kids' rooms.
  #
  # Single source of truth, consumed in two places:
  #   - scripts/apply_ac_settings.yaml     — decides on/off
  #   - automations/comed_ac_bedroom_hold.yaml — decides whether an ON was manual
  #
  # That second use is why these must live in one place. The manual-hold logic
  # rests on "the script only ever turns these rooms ON inside their window, so
  # an ON while the window is closed can only be a human." If the two files ever
  # disagreed about the window, the script's own turn-ons would start latching
  # holds. Templates referencing now() re-render at the top of every minute, so
  # these flip exactly on the boundary.
  - binary_sensor:
      - name: Bedroom 2 AC Scheduled
        unique_id: bedroom_2_ac_scheduled
        icon: mdi:calendar-clock
        state: >
          {% set t = now() %}
          {{ t.weekday() >= 5
             or not (today_at('07:00') <= t < today_at('16:30')) }}

      - name: Bedroom 3 AC Scheduled
        unique_id: bedroom_3_ac_scheduled
        icon: mdi:calendar-clock
        state: >
          {% set t = now() %}
          {{ t >= today_at('18:00')
             or t < today_at('07:00')
             or (t.weekday() >= 5
                 and today_at('11:00') <= t <= today_at('15:30')) }}
